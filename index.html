<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#222;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
        .card{background:#fff;border-radius:16px;padding:40px;box-shadow:0 8px 30px rgba(0,0,0,0.08);text-align:center;max-width:500px;width:100%}
        h1{font-size:32px;margin-bottom:16px;color:#1f2937}
        p{font-size:16px;color:#6b7280;margin-bottom:24px}
        .link{display:inline-block;padding:12px 24px;background:#2563eb;color:#fff;border-radius:999px;text-decoration:none;font-weight:500;transition:0.2s}
        .link:hover{background:#1d4ed8}
    </style>
</head>
<body>
    <div class="card">
        <h1>👋 你好，欢迎</h1>
        <p>这是我的 GitHub Pages 个人主页</p>
        <a class="link" href="https://github.com/tengxiao621">访问我的 GitHub</a>
    </div>
</body>
</html>
